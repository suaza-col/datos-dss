      - name: "Territorio"
        type: "character"
      - name: "cod_local"
        type: "character"
      - name: "anio"
        type: "integer"
      - name: "sexo"
        type: "character"
      - name: "zona"
        type: "character"
      - name: "etnia"
        type: "character"
      - name: "valor"
        type: "numeric"
  updated: "2026-05-13"

